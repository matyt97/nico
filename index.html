<script>
// [id, nombre, sección, causa, pasos(|), síntoma>por qué (;), extra]
const D=[
["acal","Acalasia","Esófago","Infección viral previa (VHS-1, T. cruzi) con inflamación por LT CD8+","LT CD8+ destruyen neuronas del plexo de Auerbach|Se pierden las neuronas inhibitorias: ↓NO y ↓VIP|El EEI no relaja al deglutir|Persisten neuronas colinérgicas (ACh, sustancia P): EEI hipertónico y aperistalsis|Esófago dilatado con estrechez distal","Disfagia a sólidos y líquidos>El EEI no relaja y no hay peristalsis;Regurgitación de alimento no digerido>El alimento se estanca sobre el EEI cerrado;Dolor torácico>Contracciones desorganizadas del cuerpo esofágico;Pérdida de peso>Menor ingesta por la disfagia","Bario: esófago dilatado con pico de pájaro. Manometría: aperistalsis y EEI sin relajar (Chicago I-III). Tto: nitratos o BCC, toxina botulínica, dilatación neumática, miotomía de Heller."],
["motor","Espasmo esofágico difuso y cascanueces","Esófago","EED: falla de la vía nitrérgica. Cascanueces: hiperactividad colinérgica","EED: falla la liberación de NO|Se acorta la latencia peristáltica distal|Los 2/3 inferiores se contraen a la vez y no en secuencia|Cascanueces: estimulación colinérgica excesiva e hipertrofia de la capa circular|La peristalsis se conserva pero con fuerza desproporcionada","Dolor torácico anginoso (EED)>Contracciones simultáneas e intensas;Disfagia intermitente (EED)>El bolo no avanza de forma coordinada;Dolor torácico (cascanueces)>Contracciones de fuerza excesiva","EED: bario en sacacorchos, manometría con contracciones simultáneas. Cascanueces: manometría >180 mmHg peristáltica, a menudo asintomático, tto BCC o nitratos. El PDF no indica tratamiento del EED."],
["escler","Esclerodermia esofágica","Esófago","Enfermedad autoinmune con microangiopatía obliterante","Vasculopatía obstructiva de la microcirculación|Isquemia de los vasa nervorum: neuropatía mientérica distal|Atrofia del músculo liso por desuso|TGF-β activa fibroblastos: fibrosis con colágeno I y III|Aperistalsis distal y EEI <10 mmHg (vía abierta)|Reflujo masivo sin aclaramiento","Pirosis>EEI hipotónico y sin aclaramiento peristáltico;Disfagia>Aperistalsis del esófago distal","Complicaciones: esofagitis erosiva grave, estenosis péptica, Barrett. Tto: medidas antirreflujo e IBP."],
["hernia","Hernia hiatal","Esófago","Debilidad del diafragma y ↑ de la presión abdominal (obesidad, embarazo, tos, tabaco, alcohol)","Remodelado del colágeno del ligamento frenoesofágico (↑MMP-1 y MMP-2)|El gradiente abdomen (+) a tórax (−) empuja el estómago por el hiato|El EEI migra al tórax y se desacopla de la crura|Se aplana el ángulo de His: se pierde la válvula flap|Atrapamiento del ácido en el saco herniario y re-reflujo en la inspiración","Pirosis>Barrera antirreflujo desacoplada;Regurgitación>Reflujo libre sin válvula flap;Anemia ferropénica>Úlceras de Cameron: fricción del estómago herniado con el hiato causa sangrado crónico","Tipo I deslizamiento (90-95%), II paraesofágica pura, III mixta, IV masiva con otros órganos. Vólvulo gástrico sobre todo en II, III y IV."],
["erge","ERGE","Esófago","Falla de la barrera antirreflujo y mal aclaramiento","Relajaciones transitorias del EEI (70-80% de leves/moderados), hipotonía <10 mmHg o hernia|Reflujo de ácido y pepsina|Aclaramiento peristáltico y salival (bicarbonato) deficiente|El ácido rompe uniones estrechas (ocludina, claudina) y penetra H+|Se estimulan nociceptores: pirosis. Citocinas reclutan LT y PMN|Esofagitis, estenosis, Barrett y cáncer","Pirosis>H+ llega a nociceptores de fibras no mielinizadas;Tos crónica>Microaspiración;Disfonía>Irritación directa de las cuerdas vocales;Erosión dental>Ácido sobre el esmalte lingual","Dx: clínica + EDA + pH-impedanciometría 24 h. Los Ángeles A-D (C y D concluyentes). Tto: medidas + IBP 8 semanas. Alarma: disfagia, baja de peso, anemia, >50 años."],
["barr","Esófago de Barrett","Esófago","Reflujo crónico de ácido (pH <4) y ácidos biliares","Agresión química y estrés oxidativo en la capa basal|Reprogramación de células madre (NF-κB, CDX2/SOX9)|Epitelio escamoso pasa a cilíndrico intestinal con caliciformes|Inactivación de p15/CDKN2A (etapa temprana)|Pérdida de TP53: displasia de bajo a alto grado|Adenocarcinoma","Mucosa rojo salmón>Epitelio cilíndrico reemplaza al escamoso;Mejora la pirosis>Paradoja del Barrett: mayor tolerancia epitelial a medida que avanza","Dx: EDA + biopsia con células caliciformes. Sin displasia: vigilar cada 3-5 años (Seattle). Alto grado: erradicación endoscópica."],
["gastr","Gastritis crónica","Estómago","H. pylori (más del 90%) o autoinmune","H. pylori coloniza el moco antral: la ureasa genera NH4+ que neutraliza el ácido|CagA y VacA dañan uniones y epitelio|Atrofia de células D (↓somatostatina): las G secretan más gastrina: hiperclorhidria|Si pasa al cuerpo (pangastritis): atrofia e hipoclorhidria|Correa: atrofia, metaplasia intestinal, displasia, adenocarcinoma","Úlcera duodenal (antral)>Hiperclorhidria por hipergastrinemia;Anemia perniciosa (autoinmune)>Anti-H+/K+ ATPasa y anti-factor intrínseco: sin FI no se absorbe B12;Hipergastrinemia (autoinmune)>Sin ácido se pierde el freno de la gastrina","Autoinmune: riesgo de tumor carcinoide tipo 1. H. pylori: linfoma MALT. Tto: cuádruple con bismuto 14 días (IBP, bismuto, metronidazol, tetraciclina)."],
["ulc","Úlcera péptica","Estómago","H. pylori (70-90% de duodenales) o AINEs","H. pylori: hiperclorhidria. AINEs: inhiben COX-1, ↓PGE2, ↓moco, bicarbonato y flujo|Se rompe la barrera mucosa|Retrodifusión de H+ y activación de pepsina|Digestión proteolítica pasa la muscularis mucosae","Duodenal: alivia al comer y despierta de noche>El alimento amortigua el exceso de ácido;Gástrica: empeora con la comida y baja de peso>Hay hipoclorhidria relativa y pérdida de la defensa mucosa","Complicaciones: hemorragia (la más frecuente), perforación, obstrucción pilórica. Solo la gástrica se maligniza: biopsia obligatoria. Tto: suspender AINEs, erradicar H. pylori, IBP 4-8 semanas."],
["cgas","Cáncer gástrico","Estómago","Intestinal (H. pylori, nitrosaminas) o difuso (pérdida de CDH1)","Intestinal: gastritis crónica, atrofia, metaplasia, displasia, adenocarcinoma (Correa)|Difuso: pérdida de E-cadherina (CDH1)|Células aisladas infiltran la pared sin formar glándulas|Anillo de sello y fibrosis estromal: linitis plástica","Nódulo de Virchow>Diseminación linfática a ganglio supraclavicular izquierdo;Tumor de Krukenberg>Metástasis ovárica, típica del difuso;Saciedad precoz>Rigidez y obstrucción gástrica","Tto: resección endoscópica si es temprano; gastrectomía con D2; FLOT perioperatorio; trastuzumab si HER2+; inmunoterapia en MSI-H."],
["cel","Enfermedad celíaca","Intestino delgado","Gluten en personas con HLA-DQ2/DQ8","La tTG desamina la gliadina|Se une a HLA-DQ2/DQ8 y activa LT CD4+|IFN-γ y TNF-α dañan la mucosa|Atrofia vellositaria, hiperplasia de criptas y ↑ permeabilidad|Malabsorción de hierro, calcio, folato y vitaminas liposolubles","Esteatorrea y diarrea>Menor superficie absortiva;Anemia ferropénica>Daño del duodeno y yeyuno proximal;Osteoporosis>Malabsorción de calcio y vitamina D","Dx: anti-tTG IgA (medir IgA total) y biopsia duodenal. Tto: dieta sin gluten de por vida. Riesgo de linfoma T y adenocarcinoma intestinal."],
["cro","Enfermedad de Crohn","Intestino delgado","Genes (NOD2, ATG16L1, IL23R) más ambiente (tabaco, dieta)","Barrera epitelial débil y disbiosis|Traslocación bacteriana|Th1 (IL-12, IFN-γ) y Th17 (IL-23) forman granulomas|Inflamación transmural: estenosis (B2) o fístulas y abscesos (B3)","Diarrea sin sangre>Malabsorción de sales biliares en el íleon terminal y secreción por citocinas;Dolor en fosa ilíaca derecha>Íleon terminal inflamado o estenosado;Anemia megaloblástica>El íleon terminal no absorbe B12;Fístulas>La inflamación atraviesa toda la pared","Lesiones salteadas, de boca a ano; granulomas no caseificantes; ASCA. El tabaco aumenta el riesgo. Tto: corticoides, tiopurinas, anti-TNF, vedolizumab, ustekinumab."],
["cu","Colitis ulcerosa","Intestino grueso","Genética (HLA-DRB1*0103) y barrera mucosa alterada","Menos MUC2 y claudinas: pasa la microbiota|Respuesta Th2/NKT: IL-13 induce apoptosis de enterocitos|Neutrófilos entran a las criptas: abscesos crípticos|Inflamación continua desde el recto, limitada a mucosa y submucosa","Rectorragia>Úlceras y fragilidad de la mucosa;Tenesmo>Proctitis que altera la acomodación rectal;Megacolon tóxico>La inflamación llega a la muscular propia y destruye el plexo de Auerbach","p-ANCA. El tabaco protege. Asociada a colangitis esclerosante primaria. Riesgo de cáncer en enfermedad extensa. Colectomía en megacolon refractario."],
["colec","Colecistitis aguda","Vía biliar","Cálculo impactado en el cístico (90-95%)","El cálculo obstruye el cístico (bolsa de Hartmann)|Distensión y ↑ de la presión intraluminal|Isquemia de la pared|Lisolecitina y prostaglandinas perpetúan la inflamación|Sobreinfección (E. coli, Klebsiella, Enterococcus)","Dolor en hipocondrio derecho>Distensión e inflamación de la pared vesicular;Signo de Murphy>Dolor al palpar el punto cístico detiene la inspiración;Ictericia leve>Compresión inflamatoria de la vía biliar (Mirizzi)","Eco: pared >4-5 mm, doble pared, líquido perivesicular. Tokio. Grado I: colecistectomía laparoscópica precoz. Grado III: colecistostomía percutánea."],
["colan","Colangitis","Vía biliar","Obstrucción (coledocolitiasis) más infección ascendente","Obstrucción y estasis biliar|Presión intraductal >20 cmH2O altera la barrera epitelial|Reflujo colangiovenoso y colangiolinfático|Bacterias y endotoxinas pasan a la sangre: sepsis","Fiebre, ictericia y dolor en hipocondrio derecho (Charcot)>Infección más obstrucción biliar;Confusión e hipotensión (Reynolds)>Colangitis supurativa grave con sepsis","Ceftriaxona + metronidazol. Grado II: drenaje temprano; grado III: urgente (CPRE o percutáneo)."],
["pag","Pancreatitis aguda","Páncreas","Litiasis biliar, alcohol, hipertrigliceridemia","Se bloquea la secreción acinar|Los lisosomas se fusionan con zimógenos: la catepsina B activa tripsinógeno|La tripsina activa elastasa y fosfolipasa A2: autodigestión|NF-κB libera TNF-α, IL-1 e IL-6 y recluta neutrófilos|Fuga capilar: SRIS, shock, SDRA, falla renal","Dolor en cinturón que alivia al inclinarse>Inflamación retroperitoneal del páncreas;Lipasa elevada>Enzimas escapan de acinos dañados (más específica y dura más);Hipocalcemia>Saponificación del calcio con ácidos grasos libres;Hiperglicemia>Daño de células β y respuesta al estrés","Ranson, Atlanta. Tto: Ringer lactato moderado guiado por metas, nutrición enteral precoz, analgesia, antibióticos solo si hay necrosis infectada, CPRE si colangitis."],
["pcr","Pancreatitis crónica","Páncreas","Alcohol (60-70%) y tabaco; también genética y obstructiva","Daño repetido: estrés oxidativo y necrosis focal|TGF-β y ROS activan las células estrelladas|Colágeno I y III: fibrosis irreversible|Tapones proteicos y cálculos de calcio obstruyen los conductos|Pérdida de más del 90% del tejido acinar y de los islotes","Esteatorrea>Déficit de lipasa por pérdida acinar;Diabetes tipo 3c lábil>Pérdida paralela de células β y α;Dolor crónico>Hipertensión ductal y neuropatía","Tto: enzimas pancreáticas (TREP) + IBP, insulina con cautela, descompresión (Puestow, litotricia, stents)."],
["cir","Cirrosis e hipertensión portal","Hígado","Alcohol, VHB, VHC, MASH, autoinmune, genéticas","Lesión crónica persistente y muerte hepatocelular|Kupffer liberan TGF-β y PDGF|Las células estrelladas se vuelven miofibroblastos: colágeno I y III|Capilarización sinusoidal y fibrosis en puentes con nódulos: ↑ resistencia|Vasodilatación esplácnica (NO) ↑ flujo: hipertensión portal (P = Q × R)","Várices y cabeza de medusa>Circulación colateral por la desviación del flujo portal;Esplenomegalia y plaquetopenia>Congestión y secuestro esplénico;Hemorragia variceal>GPVH mayor de 12 mmHg","GPVH ≥10 mmHg es clínicamente significativo. Tto: betabloqueantes no selectivos, TIPS. Child-Pugh: A 5-6, B 7-9, C 10-15."],
["asc","Ascitis y PBE","Hígado","Hipertensión portal en cirrosis","HTP produce vasodilatación esplácnica por NO|Hipovolemia arterial efectiva|Se activan SRAA, simpático y ADH: retienen Na+ y agua|↑ presión hidrostática sinusoidal e hipoalbuminemia: trasuda al peritoneo|Traslocación bacteriana infecta el líquido: PBE","Distensión abdominal>Líquido libre en la cavidad peritoneal;Fiebre y dolor difuso (PBE)>Infección del líquido ascítico, con inmunidad local deficiente","PBE: PMN ≥250/mm³. Tto ascitis: restricción de sodio, espironolactona + furosemida, paracentesis con albúmina. PBE: cefotaxima o ceftriaxona + albúmina."],
["eh","Encefalopatía hepática","Hígado","Insuficiencia hepatocelular y shunts portosistémicos","Las bacterias producen amonio y el hígado no lo convierte en urea|El amonio cruza la barrera hematoencefálica|El astrocito lo une a glutamato: glutamina (osmóticamente activa)|Edema astrocitario y disfunción neuroglial","Asterixis>Pérdida intermitente del tono postural;Alteración de conciencia>Edema astrocitario por glutamina","West-Haven grados 1-4. Tto: lactulosa o lactitol, rifaximina, corregir el factor precipitante (infección, hemorragia, constipación, sedantes)."],
["shr","Síndrome hepatorrenal","Hígado","Cirrosis avanzada con ascitis","HTP y vasodilatación esplácnica masiva|↓ del volumen arterial efectivo|Se activan SRAA, simpático y ADH|Vasoconstricción de la arteriola aferente renal|Cae la TFG sin daño estructural","Sodio urinario <10-15 mEq/L>Riñón sano reabsorbe todo el sodio;Sedimento urinario limpio>No hay lesión parenquimatosa;Hiponatremia dilucional>Retención de agua libre por ADH","Dx: AKI sin respuesta a 48 h sin diuréticos y albúmina 1 g/kg. Tto: terlipresina + albúmina; TIPS o trasplante."],
["disf","Disfagia","Esófago","Alteración orofaríngea (alta) o esofágica (baja)","Alta: pérdida del control motor o incoordinación entre la faringe y el EES|Baja: peristalsis disminuida o descoordinada y EEI alterado|El bolo no transita bien|Aspiración, desnutrición y deshidratación","Disfagia lógica (sólidos, luego blandos, luego líquidos)>Obstrucción orgánica progresiva, como una estrechez;Disfagia ilógica e intermitente>Trastorno motor, como acalasia o espasmo;Neumonía por aspiración>La incoordinación orofaríngea deja pasar alimento a la vía aérea","Dx: trago de bario, endoscopía con biopsias, manometría si la EDA es normal. Tto: dieta, terapia de deglución, dilatación, etiológico o quirúrgico."],
["mw","Síndrome de Mallory-Weiss","Esófago","Vómitos intensos","Relajación inadecuada del EEI durante el vómito|Estiramiento brusco de la unión gastroesofágica|Desgarros longitudinales de la mucosa o pared esofágica","Desgarro longitudinal en la unión gastroesofágica>El vómito empuja contra un EEI que no relajó","Complicaciones: infección, ulceración, mediastinitis."],
["cesof","Cáncer de esófago","Esófago","Escamoso: alcohol, tabaco, bebidas muy calientes, acalasia. Adenocarcinoma: ERGE, Barrett, obesidad","Escamoso: agresión térmica o química|Inflamación y recambio celular aumentado|Mutación de P53 y P16, amplificación de ciclina D y EGFR|Adenocarcinoma: reflujo crónico y ROS, metaplasia de Barrett|Pérdida de P53 y metilación de p16: displasia, luego adenocarcinoma invasor","Disfagia y baja de peso>El tumor obstruye la luz;Disfonía>Invasión del nervio laríngeo recurrente;Neumonías aspirativas recurrentes>Fístula traqueoesofágica o broncoesofágica;Sangrado masivo o taponamiento>Invasión de aorta y pericardio","Diseminación linfática precoz (cervicales, mediastínicos, celíacos) y hematógena a hígado, pulmón y hueso. Dx: clínica, EDA, biopsia, Rx con contraste. Tto: cirugía, RT y QT neoadyuvante y paliativa."],
["gag","Gastritis aguda","Estómago","AINEs, alcohol, cáusticos, H. pylori agudo, estrés en pacientes críticos","AINEs inhiben COX-1: ↓PGE2, ↓moco y bicarbonato. El alcohol rompe las membranas|Retrodifusión de H+: acidifica la submucosa y degranula mastocitos|Histamina y leucotrienos: edema, microhemorragias y neutrófilos|Estrés: vasoconstricción esplácnica e isquemia de la mucosa","Hematemesis o melena>Erosiones y microhemorragias;Úlceras de Curling>Quemaduras extensas;Úlceras de Cushing>Daño del SNC con hipersecreción ácida por estimulación vagal","EDA es el gold estándar. Tto: retirar el agente, IBP o anti-H2, sucralfato, misoprostol en AINEs crónicos, profilaxis con IBP en UCI de alto riesgo."],
["disp","Dispepsia","Estómago","Funcional (60-70%) u orgánica (úlcera, ERGE, H. pylori, neoplasia, AINEs)","Retraso del vaciamiento y falla de acomodación del fundus|Hipersensibilidad visceral|Microinflamación duodenal con eosinófilos y mastocitos|Disfunción del eje cerebro-intestino","Saciedad precoz>Falla de acomodación del fundus;Dolor epigástrico>Hipersensibilidad a distensión normal;Plenitud postprandial>Retraso del vaciamiento","Roma IV: distrés postprandial y dolor epigástrico. Epigástrico: IBP. Postprandial: procinéticos. Alarma: baja de peso, vómitos persistentes, disfagia, anemia, masa, inicio >60 años."],
["sma","Síndrome de mala absorción","Intestino delgado","Defecto en la fase luminal, mucosa o post-mucosa","Luminal: falta de lipasa o sales biliares (páncreas, SIBO, íleon)|Mucosa: atrofia vellositaria o déficit de disacaridasas|Post-mucosa: linfangiectasia o isquemia|Los nutrientes no se absorben","Esteatorrea>Grasa no digerida o no solubilizada;Diarrea osmótica>Carbohidratos no absorbidos arrastran agua;Edemas y ascitis>Pérdida de proteínas e hipoalbuminemia;Diátesis hemorrágica>Déficit de vitamina K y de factores II, VII, IX y X;Osteomalacia>Déficit de vitamina D y calcio con hiperparatiroidismo 2°;Meteorismo>Fermentación colónica","Grasa fecal van de Kamer >7 g/24h; elastasa fecal <200; D-xilosa baja indica enfermedad de mucosa. Tto: etiológico, MCT y vitaminas liposolubles."],
["sibo","SIBO","Intestino delgado","Hipomotilidad, alteración anatómica, hipoclorhidria (IBP) o inmunodeficiencia","Fallan las barreras: ácido, motilidad, válvula ileocecal e IgA|Proliferación bacteriana >10⁵ UFC/mL|Fermentación (H2, metano), desconjugación de sales biliares y consumo de B12|Daño mucoso e inflamación de bajo grado","Distensión y flatulencia>Gases por fermentación;Esteatorrea>Sales biliares desconjugadas;Anemia macrocítica>Las bacterias consumen B12","Dx: aliento con lactulosa o glucosa; cultivo de aspirado >10⁵. Tto: rifaximina, dieta baja en FODMAP, tratar la causa."],
["sii","Síndrome de intestino irritable","Intestino grueso","Trastorno funcional sin alteración estructural","Hipersensibilidad visceral|Motilidad alterada por disfunción entérica|Eje intestino-cerebro y estrés (eje HHA)|Disbiosis, inflamación leve y mayor permeabilidad","Dolor que alivia con la defecación>Contracciones espásticas del intestino;Diarrea o estreñimiento>Tránsito acelerado o enlentecido;Distensión>Los FODMAP se fermentan y producen gas","Roma IV: dolor ≥1 día/semana por 3 meses con ≥2 criterios. Sin sangre ni baja de peso. Tto: dieta baja en FODMAP, antiespasmódicos, neuromoduladores."],
